plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'  // FCM / Firebase
}

android {
    namespace 'com.antigravity.tracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.antigravity.tracker"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Strategy 6: Fused Location — best-in-class accuracy (GPS + Cell + WiFi + Accelerometer)
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Strategy 1+3: Foreground Service + Lifecycle awareness
    implementation 'androidx.lifecycle:lifecycle-service:2.8.1'

    // Strategy 4: WorkManager Watchdog (auto-revive if killed)
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // Strategy 5: FCM Silent Push (admin remote wake/stop any device)
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'

    // MQTT Dual-Broker transport
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'org.eclipse.paho:org.eclipse.paho.android.service:1.1.1'

    // LocalBroadcastManager (live telemetry to UI)
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
}
